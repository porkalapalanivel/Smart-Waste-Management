<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>♻️ Smart Waste Management System</h1>

    <nav>
        <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
        <a href="{{ url_for('profile') }}">👤 Profile</a>
        <a href="{{ url_for('reports') }}">📊 Reports</a>
        <a href="{{ url_for('login') }}">🚪 Logout</a>
    </nav>
</header>

<main>

    <h2>📝 Submit Waste Complaint</h2>

    <form action="{{ url_for('complaint') }}" method="POST" enctype="multipart/form-data">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="location">Waste Location:</label><br>
        <input type="text" id="location" name="location" required><br><br>

        <label for="type">Waste Type:</label><br>
        <select id="type" name="type" required>
            <option value="">-- Select Waste Type --</option>
            <option value="Plastic">Plastic</option>
            <option value="Organic">Organic</option>
            <option value="Electronic">Electronic</option>
            <option value="Medical">Medical</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label for="description">Complaint Description:</label><br>
        <textarea id="description" name="description" rows="5" cols="40" required></textarea>

        <br><br>
          
        <label>Upload Image:</label><br>
        <input type="file" name="image">
        <br><br>
        <button type="submit">Submit Complaint</button>
         

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        <button type="button">⬅️ Back to Dashboard</button>
    </a>

</main>

<footer>
    <p>&copy; 2026 Smart Waste Management System</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
