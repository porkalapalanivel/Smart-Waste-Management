<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background: #2e8b57;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #246b45;
        }

        h2 {
            color: #2e8b57;
        }
    </style>
</head>

<body>
    <form action="login.html">

<div class="box">

    <h2>Admin Login 👨‍💼</h2>

    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">

    <button onclick="login()">Login</button>

</div>

<script>
function login() {
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;

    // simple admin check
    if (user === "admin" && pass === "1234") {
        alert("Login Successful ✅");
        window.location.href = "admin-dashboard.html";
    } else {
        alert("Invalid Login ❌");
    }
}
</script>
    </form>
</body>
</html>
