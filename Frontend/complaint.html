
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🗑️ Waste Complaint Form</h1>
    </header>

    <main>

        <form>

            <label for="name">Name:</label><br>
            <input type="text" id="name" required><br><br>

            <label for="location">Location:</label><br>
            <input type="text" id="location" required><br><br>

            <label for="complaint">Complaint Details:</label><br>
            <textarea id="complaint" rows="5" required></textarea><br><br>

            <button type="submit">Submit Complaint</button>

        </form>

        <br>

        <a href="index.html">
            <button type="button">Back to Home</button>
        </a>

    </main>

    <footer>
        <p>&copy; 2026 Waste Management System</p>
    </footer>

</body>
</html>
