<!DOCTYPE html>
<html>
<head>
    <title>Complaint Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🗑️Waste Complaint Registration</h2>

<form action="dashboard.html">
    <label>Name:</label><br>
    <input type="text" placeholder="Enter your name"><br><br>

    <label>Location:</label><br>
    <input type="text" placeholder="Enter location"><br><br>

    <label>Waste Type:</label><br>
    <select>
        <option>Plastic</option>
        <option>Food Waste</option>
        <option>Paper Waste</option>
    </select><br><br>

    <label>Description:</label><br>
    <textarea placeholder="Describe the waste problem"></textarea><br><br>

    <button type="submit">Submit Complaint</button>
</form>

</body>
</html>
